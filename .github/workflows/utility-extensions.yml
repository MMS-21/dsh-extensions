name: Utility extension tests
on:
  push:
    paths: ['packages/agent-state-light/**', 'packages/session-delete/**', '.github/workflows/utility-extensions.yml']
  pull_request:
    paths: ['packages/agent-state-light/**', 'packages/session-delete/**', '.github/workflows/utility-extensions.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        package: [agent-state-light, session-delete]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
        working-directory: packages/${{ matrix.package }}
      - run: npm test
        working-directory: packages/${{ matrix.package }}
