name: Request budget tests
on:
  push:
    paths:
      - 'packages/request-budget/**'
      - '.github/workflows/request-budget.yml'
  pull_request:
    paths:
      - 'packages/request-budget/**'
      - '.github/workflows/request-budget.yml'
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
        working-directory: packages/request-budget
      - run: node --check scripts/test.mjs
